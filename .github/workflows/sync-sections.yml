name: Sync sections from sheet

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull sections from the Comedy Database sheet
        env:
          SECTIONS_CSV_URL: ${{ vars.SECTIONS_CSV_URL }}
        run: python3 sync_sections.py directory

      - name: Rebuild the directory
        run: python3 build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sections.json index.html robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync sections from sheet"
            git push
          fi
